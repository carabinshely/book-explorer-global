name = "bronerbooks-link-resolver"
main = "index.ts"
compatibility_date = "2025-02-01"

# Production owns only this route; all other website paths remain with the site host.
[env.production]
workers_dev = false
preview_urls = false
routes = [{ pattern = "bronerbooks.com/r/*", zone_name = "bronerbooks.com" }]

# Preview remains a separate workers.dev Worker and cannot attach the canonical route.
[env.preview]
name = "bronerbooks-link-resolver-preview"
workers_dev = true
preview_urls = true
