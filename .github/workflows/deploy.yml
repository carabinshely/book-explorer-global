name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Mark live Privacy Notice verification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"privacy-live-smoke","description":"Waiting for deployed Privacy Notice verification"}'

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Verify approved Privacy Notice in the live bundle
        id: privacy_smoke
        continue-on-error: true
        run: node scripts/site-smoke.mjs --origin https://bronerbooks.com

      - name: Publish live Privacy Notice verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.privacy_smoke.outcome }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${SMOKE_OUTCOME}" == "success" ]]; then
            state="success"
            description="Live Privacy Notice matches approved identity/version"
          else
            state="failure"
            description="Live Privacy Notice verification failed"
          fi

          payload="$(STATE="${state}" DESC="${description}" TARGET="${DEPLOYMENT_URL}" python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "privacy-live-smoke",
              "description": os.environ["DESC"],
              "target_url": os.environ["TARGET"],
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "${payload}"

      - name: Enforce live Privacy Notice verification
        if: always() && steps.privacy_smoke.outcome != 'success'
        run: exit 1
