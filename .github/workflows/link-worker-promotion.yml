name: Promote link Worker (manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "check is dry-run only; deploy uploads this exact commit then deploys its captured version"
        required: true
        default: check
        type: choice
        options: [check, deploy, rollback, detach-route]
      environment:
        description: "Protected GitHub environment to use"
        required: true
        default: preview
        type: choice
        options: [preview, production]
      version:
        description: "Exact healthy Worker version ID (required only for rollback)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: link-worker-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote:
    name: ${{ inputs.operation }} link Worker (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: link-worker-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.environment == 'production' && secrets.CLOUDFLARE_API_TOKEN_LINKS_PRODUCTION || secrets.CLOUDFLARE_API_TOKEN_LINKS_PREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LINK_SMOKE_URL: ${{ vars.LINK_SMOKE_URL }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: git diff --exit-code -- worker/manifest.fixture.json worker/manifest.integrity.ts worker/wrangler.toml
      - run: npm run links:check
      - run: npm run links:test
      - run: npm run links:smoke:local
      - run: bash worker/typecheck.sh
      - run: npm run links:docs:check
      - name: Validate manual plan
        run: |
          if [ "${{ inputs.operation }}" = "check" ]; then
            npm run links:deploy:preview -- --check
          elif [ "${{ inputs.operation }}" = "detach-route" ]; then
            npm run links:detach-route -- --environment production --check
          elif [ "${{ inputs.operation }}" = "rollback" ]; then
            npm run links:rollback -- --environment "${{ inputs.environment }}" --version "${{ inputs.version }}" --check
          elif [ "${{ inputs.environment }}" = "production" ]; then
            # Production deploy uploads and captures the immutable version below.
            npm run links:deploy:production -- --version pending_version --check
            npm run links:attach-route -- --environment production --version pending_version --check
          else
            npm run links:deploy:preview -- --check
          fi
      - name: Verify Cloudflare token and account configuration
        if: ${{ inputs.operation != 'check' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID GitHub environment variable is required}"
          : "${CLOUDFLARE_ZONE_ID:?CLOUDFLARE_ZONE_ID GitHub environment variable is required for the exact production route}"
          curl --fail --silent --show-error --max-time 15 --proto '=https' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | node --input-type=module -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  try {
                    if (JSON.parse(body).success !== true) throw new Error("verification failed");
                    console.log("OK: Cloudflare API token verified");
                  } catch {
                    console.error("ERROR: Cloudflare API token verification failed");
                    process.exitCode = 1;
                  }
                });
              '
          # Wrangler resolves the route zone; make the required Zone Read permission explicit.
          curl --fail --silent --show-error --max-time 15 --proto '=https' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}" \
            | node --input-type=module -e '
                let body = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { body += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const result = JSON.parse(body);
                    if (result.success !== true || result.result?.name !== "bronerbooks.com") throw new Error("zone verification failed");
                    console.log("OK: Cloudflare Zone Read permission verified for bronerbooks.com");
                  } catch {
                    console.error("ERROR: Cloudflare Zone Read permission for bronerbooks.com is required");
                    process.exitCode = 1;
                  }
                });
              '
      - name: Read pinned marketing source commit
        id: marketing_source
        if: ${{ inputs.operation == 'deploy' && inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          commit="$(node -e 'const m=require("./worker/manifest.fixture.json"); const c=m.provenance?.marketing_source_commit; if (!/^[0-9a-f]{40}$/.test(c ?? "")) process.exit(1); process.stdout.write(c)')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: ${{ inputs.operation == 'deploy' && inputs.environment == 'production' }}
        with:
          repository: carabinshely/bronerbooks-marketing-ops
          ref: ${{ steps.marketing_source.outputs.commit }}
          path: marketing-source
          ssh-key: ${{ secrets.MARKETING_REPO_DEPLOY_KEY }}
          persist-credentials: false
      - name: Verify pinned marketing compiler parity
        if: ${{ inputs.operation == 'deploy' && inputs.environment == 'production' }}
        run: |
          set -euo pipefail
          test "$(git -C marketing-source rev-parse HEAD)" = "${{ steps.marketing_source.outputs.commit }}"
          python3 -m venv /tmp/marketing-compiler-venv
          /tmp/marketing-compiler-venv/bin/pip install --disable-pip-version-check --no-input "PyYAML==6.0.2"
          (cd marketing-source && /tmp/marketing-compiler-venv/bin/python -m attribution_links compile --environment production --output /tmp/pinned-attribution-map.json)
          cmp --silent /tmp/pinned-attribution-map.json worker/manifest.fixture.json
      - name: Upload exact production commit artifact and capture version
        id: production_upload
        if: ${{ inputs.operation == 'deploy' && inputs.environment == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          worker_name="bronerbooks-link-resolver-production"
          previous=""
          artifact_sha="$(sha256sum worker/manifest.fixture.json | awk '{print $1}')"
          script_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 --proto '=https' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}")"
          if [ "$script_status" = "200" ]; then
            # Only a deployment serving 100% of traffic is safe as an automatic recovery target.
            npm exec -- wrangler deployments list --name "$worker_name" --json > previous-deployments.json
            previous="$(node -e 'const data=require("./previous-deployments.json"); const deployments=Array.isArray(data) ? data : data.result ?? data.items ?? []; for (const deployment of deployments) { const version=(deployment.versions ?? []).find((entry) => Number(entry.percentage) === 100)?.version_id; if (version) { if (!/^[A-Za-z0-9_-]{6,128}$/.test(version)) process.exit(1); process.stdout.write(version); process.exit(0); } } console.error("ERROR: no current 100%-healthy Worker version is available for recovery"); process.exit(1);')"
          fi
          if [ "$script_status" = "404" ]; then
            # First deployment only: Wrangler creates the env-suffixed script and returns its version.
            bootstrap=true
            upload="$(mktemp)"
            npm exec -- wrangler deploy --config worker/wrangler.bootstrap.toml 2>&1 | tee "$upload"
          elif [ "$script_status" = "200" ]; then
            bootstrap=false
            upload="$(mktemp)"
            npm exec -- wrangler versions upload --config worker/wrangler.toml --env production --message "commit:${GITHUB_SHA};manifest:${artifact_sha}" 2>&1 | tee "$upload"
          else
            echo "ERROR: unable to determine whether ${worker_name} exists (HTTP ${script_status})" >&2
            exit 1
          fi
          version="$(sed -nE 's/.*[Vv]ersion ID:[[:space:]]*([^[:space:]]+).*/\1/p' "$upload" | tail -n 1)"
          [[ "$version" =~ ^[A-Za-z0-9_-]{6,128}$ ]] || { echo "ERROR: Wrangler did not report a valid version ID" >&2; exit 1; }
          npm exec -- wrangler versions view "$version" --name "$worker_name" --json > version.json
          if [ "$bootstrap" = true ]; then
            # Bootstrap deploy has no --message. Verify its exact local bundle input instead.
            test "$artifact_sha" = "$(git show "${GITHUB_SHA}:worker/manifest.fixture.json" | sha256sum | awk '{print $1}')"
            node worker/verify-fixture.mjs
          else
            node --input-type=module -e 'const v = JSON.parse(await (await import("node:fs/promises")).readFile("version.json", "utf8")); if (!JSON.stringify(v).includes(process.env.GITHUB_SHA)) throw new Error("uploaded version is not tied to this commit");'
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous_version=$previous" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$artifact_sha" >> "$GITHUB_OUTPUT"
          PREVIOUS="$previous" VERSION="$version" MANIFEST="$artifact_sha" node -e 'require("fs").writeFileSync("release-evidence.json", JSON.stringify({commit:process.env.GITHUB_SHA,previous_version:process.env.PREVIOUS || null,new_version:process.env.VERSION,manifest_sha256:process.env.MANIFEST,route:"bronerbooks.com/r/*"},null,2)+"\n")'
      - name: Deploy exact version, attach only /r, and verify recovery
        if: ${{ inputs.operation == 'deploy' && inputs.environment == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          recovery_armed=true
          prior="${{ steps.production_upload.outputs.previous_version }}"
          recover_on_failure() {
            if [ "$recovery_armed" = true ]; then
              if [ -n "$prior" ]; then
                echo "ERROR: route operation failed; rolling back to prior exact version" >&2
                npm run links:rollback -- --environment production --version "$prior" --execute || true
              else
                echo "ERROR: bootstrap route operation failed; detaching production route" >&2
                npm run links:detach-route -- --environment production --execute || true
              fi
            fi
          }
          trap recover_on_failure ERR
          if [ "${{ steps.production_upload.outputs.bootstrap }}" != "true" ]; then
            npm run links:deploy:production -- --version "${{ steps.production_upload.outputs.version }}" --execute
          fi
          npm run links:attach-route -- --environment production --version "${{ steps.production_upload.outputs.version }}" --execute
          npm run links:smoke:production -- --execute
          recovery_armed=false
          trap - ERR
      - name: Persist sanitized production release evidence
        if: ${{ always() && inputs.operation == 'deploy' && inputs.environment == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: link-worker-release-evidence
          path: release-evidence.json
          if-no-files-found: error
      - name: Publish sanitized release summary
        if: ${{ always() && inputs.operation == 'deploy' && inputs.environment == 'production' }}
        run: test -f release-evidence.json && cat release-evidence.json >> "$GITHUB_STEP_SUMMARY" || true
      - name: Execute approved preview deployment or exact-version rollback
        if: ${{ inputs.operation == 'rollback' || inputs.operation == 'detach-route' || (inputs.operation == 'deploy' && inputs.environment == 'preview') }}
        run: |
          if [ "${{ inputs.operation }}" = "rollback" ]; then
            npm run links:rollback -- --environment "${{ inputs.environment }}" --version "${{ inputs.version }}" --execute
          elif [ "${{ inputs.operation }}" = "detach-route" ]; then
            npm run links:detach-route -- --environment production --execute
          else
            npm run links:deploy:preview -- --execute
          fi
      - name: Verify exact canonical route after an approved change
        if: ${{ inputs.operation == 'rollback' || (inputs.operation == 'deploy' && inputs.environment == 'preview') }}
        run: npm run links:smoke:${{ inputs.environment }} -- --execute
